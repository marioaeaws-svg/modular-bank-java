global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: accounts-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["accounts-service:8081"]

  - job_name: transfers-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transfers-service:8083"]

  - job_name: monolith
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["monolith:8080"]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
